run-name: '[CD/M] Deploy App to ${inputs.awsAccountType} in ${inputs.awsRegion} with ${inputs.awsProfile}'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.awsRegion }}
          aws-profile: ${{ inputs.awsProfile }}

      - name: Deploy application
        run: |
          echo "Deploying application to ${inputs.awsAccountType} in ${inputs.awsRegion} with profile ${inputs.awsProfile}"
          # Add your deployment commands here, e.g., using AWS CLI or CDK
